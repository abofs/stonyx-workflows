name: Reusable CI

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        type: string
        default: '24.13.0'
      pnpm-version:
        description: 'pnpm version'
        type: string
        default: '9'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # This job runs the consumer's `pnpm install` lifecycle scripts and
          # `pnpm test`. actions/checkout would otherwise leave the job's
          # GITHUB_TOKEN in .git/config where that code can read it, and no step
          # in this workflow reads git credentials (abofs/stonyx-workflows#35).
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
